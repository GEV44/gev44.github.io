const I=[

const norm=s=>s.toLowerCase().replace(/[՞՜՛՝՟։]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
function intent(text){
 const t=" "+norm(text)+" ", toks=t.trim().split(" "); let best=null,sc=0;
 for(const [k,ws] of I){let s=0;for(const w of ws){
   if(w.includes(" ")){if(t.includes(" "+w)||t.includes(w))s+=2.5}
   else for(const tk of toks){ if(tk.startsWith(w)&&(w.length>=3||tk===w)){s+=w.length>=5?2:1;break} }
 } if(s>sc){sc=s;best=k}}
 return sc>=1?best:null;
}
let L="hy",st={step:null,d:{}};
const $=id=>document.getElementById(id);
function add(txt,who,tag){const m=document.createElement("div");m.className="m "+who;m.textContent=txt;
 if(tag){const s=document.createElement("span");s.className="tag";s.textContent=tag;m.appendChild(s)}
 $("log").appendChild(m);$("log").scrollTop=1e6;return m}
function chips(arr){const c=$("chips");c.innerHTML="";arr.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>send(x);c.appendChild(b)})}
function bot(txt,tag,delay){setTimeout(()=>add(txt,"b",tag),delay==null?350:delay)}
const SRC={hy:"Ձեր տվյալներով",ru:"по вашим данным",en:"from your data"};
function card(){const D=st.d,t=T[L].bk,f=t.fl;const c=document.createElement("div");c.className="card";
 c.innerHTML="<h4></h4>"+[D.name,D.phone,D.type,D.district,D.date].map((v,i)=>"<div><span></span><span></span></div>").join("")+'<span class="ok"></span>';
 c.querySelector("h4").textContent=t.card;const rows=c.querySelectorAll("div");
 [D.name,D.phone,D.type,D.district,D.date].forEach((v,i)=>{rows[i].children[0].textContent=f[i];rows[i].children[1].textContent=v});
 c.querySelector(".ok").textContent=t.sent;$("log").appendChild(c);$("log").scrollTop=1e6}
function book(text){
 const t=T[L].bk,D=st.d;
 if(T[L].cancelw.some(w=>norm(text).includes(w))){st={step:null,d:{}};bot(t.cancel);chips(T[L].chips);return}
 switch(st.step){
  case "name":D.name=text.trim().slice(0,40);st.step="phone";bot(t.phone.replace("{n}",D.name));chips([]);break;
  case "phone":if((text.match(/\d/g)||[]).length<6){bot(t.bad);return}D.phone=text.trim().slice(0,24);st.step="type";bot(t.type);chips(t.types);break;
  case "type":D.type=text.trim().slice(0,40);st.step="district";bot(t.district);chips([]);break;
  case "district":D.district=text.trim().slice(0,40);st.step="date";bot(t.date);break;
  case "date":D.date=text.trim().slice(0,40);st.step=null;setTimeout(()=>{card();add(t.done,"b")},350);chips(T[L].chips);st.d={};break;
 }}
function send(text){text=(text||"").trim();if(!text)return;add(text,"u");$("q").value="";
 if(st.step){book(text);return}
 const n=norm(text);
 if(T[L].bookw.some(w=>n.includes(w))){st={step:"name",d:{}};bot(T[L].bk.start);chips([]);return}
 const k=intent(text);
 if(k==="loc"&&intent(text.replace(/որտեղ|где|where/gi,""))==="hrs"){bot(T[L].a.loc+" "+T[L].a.hrs,SRC[L]);return}
 if(k&&T[L].a[k]){const known=["svc","loc","hrs","phone","damage","exp"].includes(k);bot(T[L].a[k],known?SRC[L]:null);
   if(["doc","time","price","bank","visit"].includes(k)){}}
 else bot(T[L].sorry);
}
function render(){const t=T[L];document.documentElement.lang=L;
 $("bs").textContent=t.bs;$("h1").textContent=t.h1;$("hp").textContent=t.hp;
 $("pills").innerHTML=t.pills.map(p=>"<span>"+p+"</span>").join("");
 $("cn").textContent=t.cn;$("cs").textContent=t.cs;$("q").placeholder=t.ph;$("sb").textContent=t.send;
 $("t1").textContent=t.t1;$("t2").textContent=t.t2;$("t3").textContent=t.t3;$("t4").textContent=t.t4;
 $("steps").innerHTML=t.steps.map((s,i)=>'<div class="step"><i>'+(i+1)+'</i><p><b>'+s[0]+"</b>"+s[1]+"</p></div>").join("");
 $("save").innerHTML=t.save.map(x=>"<li>"+x+"</li>").join("");
 $("facts").innerHTML=t.fk.map((k,i)=>"<div><span>"+k+"</span><span>"+t.fv[i]+"</span></div>").join("");
 $("routel").innerHTML=t.route.map(x=>"<li>"+x+"</li>").join("");
 $("foot").textContent=t.foot;
 $("log").innerHTML="";st={step:null,d:{}};add(t.hi,"b");chips(t.chips);
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 document.title="Էքսպերտ Օցենկա · "+({hy:"օգնական",ru:"помощник",en:"assistant"})[L];}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;render()});
$("f").onsubmit=e=>{e.preventDefault();send($("q").value)};
render();
if(typeof module!=="undefined")module.exports={intent,T};
</script>
