	<style>
		.s0 { fill: #408cae } 
		.s1 { fill: #515151 } 
		.s2 { fill: #8b8b8b } 
		/* ===== Logo intro animation (plays once) ===== */
		.a-icon, .a-sub, .a-physio, .a-therapy { transform-box: fill-box; }
		.a-icon { transform-origin: 50% 100%; animation: msp-rise 1s cubic-bezier(.34,1.56,.64,1) both; }
		.a-sub { animation: msp-slide 0.7s cubic-bezier(.22,1,.36,1) 0.35s both; }
		.a-physio { animation: msp-up 0.7s cubic-bezier(.22,1,.36,1) 0.5s both; }
		.a-therapy { animation: msp-up 0.7s cubic-bezier(.22,1,.36,1) 0.68s both; }
		@keyframes msp-rise {
			0% { opacity: 0; transform: translateY(18%) rotate(-14deg) scale(.92); }
			60% { opacity: 1; }
			100% { opacity: 1; transform: none; }
		}
		@keyframes msp-slide { from { opacity: 0; transform: translateX(-6%); } to { opacity: 1; transform: none; } }
		@keyframes msp-up { from { opacity: 0; transform: translateY(35%); } to { opacity: 1; transform: none; } }
		@media (prefers-reduced-motion: reduce) {
			.a-icon, .a-sub, .a-physio, .a-therapy { animation: none; }
		}
	</style>
