# Keeps the YourRealty demo (Vercel) awake so the first tap on a phone is fast instead of a 4-5 s cold start.
name: keep-warm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          for u in https://yourrealty.vercel.app/app/login https://yourrealty.vercel.app/static/app.css; do
            curl -s -o /dev/null -m 30 -w "%{http_code} %{time_total}s $u\n" "$u" || true
          done
